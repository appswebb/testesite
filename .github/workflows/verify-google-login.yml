name: Validate entre. Email Login

on:
  push:
    branches: [main]
    paths:
      - 'docs/app.js'
      - 'docs/email-auth.js'
      - 'docs/connect-turnstile.js'
      - 'docs/connect-turnstile.css'
      - 'docs/admin/index.html'
      - 'docs/index.html'
      - 'docs/admin/app.js'
      - 'docs/styles.css'
      - 'tests/email-auth-regression.test.mjs'
      - '.github/workflows/verify-google-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/email-auth.js
          node --check docs/connect-turnstile.js
          node --check docs/admin/app.js
      - name: Confirm site has only Supabase email and password login
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const app = fs.readFileSync('docs/app.js','utf8');
          const admin = fs.readFileSync('docs/admin/app.js','utf8');
          const auth = fs.readFileSync('docs/email-auth.js','utf8');
          const html = fs.readFileSync('docs/index.html','utf8');
          if (!html.includes('./email-auth.js')) throw Error('Email auth module not loaded');
          for (const [name,source] of [['app',app],['admin',admin]]) {
            if (/signInWithOAuth|data-action="google"|google-login/.test(source)) throw Error(name+': old Google login still present');
          }
          for (const keyword of ['auth.signUp(', 'auth.signInWithPassword(', 'auth.resetPasswordForEmail(', 'auth.updateUser(']) {
            if (!auth.includes(keyword)) throw Error('Missing email auth flow: '+keyword);
          }
          if (!admin.includes('entre_admin_check') || !admin.includes('signInWithPassword')) throw Error('Admin email auth missing');
          console.log('Email/password frontend and admin access verified.');
          NODE
      - name: Run email authentication regression tests
        run: node --test tests/email-auth-regression.test.mjs

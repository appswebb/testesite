name: Publish freq. to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      # GitHub's artifact index can lag behind successful uploads.
      # Avoid sporadic "No artifacts named github-pages were found".
      - name: Allow Pages artifact metadata to propagate
        run: sleep 20
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

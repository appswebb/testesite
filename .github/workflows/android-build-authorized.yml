name: CONNECT Android - build autorizado
on:
  pull_request:
    types: [opened]
    branches: [android-native]
    paths: ['.github/workflows/android-build-authorized.yml']
permissions:
  contents: read
jobs:
  build:
    if: github.head_ref == 'android-build-019' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Compilar APK de teste
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Validar assinatura e checksum
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CONNECT-Android-0.3.0-native-layout
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verificar lint
        working-directory: android
        run: gradle --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONNECT-Android-lint
          path: android/app/build/reports/
          if-no-files-found: ignore

  visual-qa:
    if: github.head_ref == 'android-build-019' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: SDK e APK de teste visual
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
          cd android
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim'
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 480
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p visual-qa
            adb shell am instrument -w com.connect.community.test/com.connect.community.PrototypeCapture | tee visual-qa/instrumentation.txt
            adb pull /sdcard/Android/data/com.connect.community/files/visual-qa/. visual-qa/
            grep -q 'INSTRUMENTATION_CODE: -1' visual-qa/instrumentation.txt
            test "$(find visual-qa -name '*.png' | wc -l)" -eq 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONNECT-Android-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 14

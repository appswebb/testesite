name: Mobile UI Regression (entre.)
on:
  push:
    branches: [main]
    paths:
      - 'docs/admin/**'
      - 'docs/connect-*.js'
      - 'docs/connect-*.css'
      - 'supabase/functions/**'
      - 'tests/**'
      - 'docs/features.css'
      - 'docs/manifest.webmanifest'
      - 'docs/instalar.html'
      - 'docs/dados.html'
      - 'docs/privacidade.html'
      - 'docs/termos.html'
      - 'docs/sw.js'
      - 'docs/icons/**'
      - 'docs/app.js'
      - 'docs/connect-app.css'
      - 'docs/perfil.html'
      - 'docs/perfil.css'
      - 'docs/perfil.js'
      - 'docs/entre-livekit.js'
      - 'docs/feed-media.js'
      - 'docs/interface-polish.css'
      - 'docs/live-experience.css'
      - 'docs/experience-hub.css'
      - 'docs/once-ui.css'
      - 'docs/theme.js'
      - 'docs/theme.css'
      - 'docs/once-source-fidelity.css'
      - 'docs/once-source-components.css'
      - 'docs/DESIGN_REFERENCE_AUDIT.md'
      - 'tests/source-fidelity.test.mjs'
      - 'tests/source-fidelity-mobile-audit.cjs'
      - 'docs/brand-mark.svg'
      - 'docs/favicon.svg'
      - 'docs/perfil.html'
      - 'docs/admin/index.html'
      - 'tests/theme-motion-audit.cjs'
      - 'docs/once-public.css'
      - 'docs/once-maintenance.css'
      - 'docs/once-info.css'
      - 'docs/perfil-once.css'
      - 'tests/once-redesign-mobile-audit.cjs'
      - 'docs/favicon.svg'
      - 'docs/offline.html'
      - 'docs/site-search.js'
      - 'docs/rooms.js'
      - 'docs/live-explore.css'
      - 'tests/live-gallery.test.mjs'
      - 'tests/live-gallery-mobile-audit.cjs'
      - 'docs/camera-lives.js'
      - 'docs/premium-recurring.js'
      - 'tests/community-hub.test.mjs'
      - 'tests/community-mobile-audit.cjs'
      - 'tests/live-sheet-viewport-audit.cjs'
      - 'tests/shared-media-reviews.test.mjs'
      - 'docs/admin/connect-admin.css'
      - 'tests/connect-app-vnext.test.mjs'
      - 'docs/connect-usernames.js'
      - 'tests/usernames-regression.test.mjs'
      - 'docs/entre-location.js'
      - 'docs/entre-location.css'
      - 'docs/entre-features.js'
      - 'supabase/migrations/**'
      - 'tests/geo-feed-support.test.mjs'
      - 'docs/entre-video.js'
      - 'docs/encounter-ui.css'
      - 'docs/entre-features.css'
      - 'tests/encounter-layout.test.mjs'
      - 'tests/encounter-mobile-audit.cjs'
      - 'docs/index.html'
      - 'docs/maintenance.css'
      - 'docs/mobile.css'
      - 'docs/social*.css'
      - 'docs/social*.js'
      - 'tests/admin-mobile-audit.cjs'
      - 'tests/avatar-mobile-audit.cjs'
      - 'tests/action-first.test.mjs'
      - 'tests/vivid-refresh.test.mjs'
      - 'docs/chat-media.js'
      - 'docs/design-refresh.css'
      - 'docs/admin/admin-refined.css'
      - 'docs/share-refined.css'
      - 'tests/social-ui-regression.test.mjs'
      - '.github/workflows/entre-mobile-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (pinned)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate scripts and UI
        run: |
          node --check docs/app.js
          node --check docs/theme.js
          node --check docs/motion.js
          node --check docs/connect-usernames.js
          node --check docs/entre-location.js
          node --check docs/entre-features.js
          node --check docs/motion.js
          node --check docs/perfil.js
          node --check docs/entre-livekit.js
          node --check docs/feed-media.js
          node --check docs/site-search.js
          node --check docs/rooms.js
          node --check docs/camera-lives.js
          node --check docs/premium-recurring.js
          node --check docs/entre-video.js
          node --check docs/admin/app.js
          for f in docs/social*.js; do node --check "$f"; done
          node --check tests/admin-mobile-audit.cjs
          node --check tests/avatar-mobile-audit.cjs
          failures=0
          run_check() { "$@" || { echo "::error::Failed: $*"; failures=1; }; }
          run_check node tests/admin-dialog-buttons.cjs
          run_check node --test tests/social-ui-regression.test.mjs
          run_check node --test tests/usernames-regression.test.mjs
          run_check node --test tests/connect-app-vnext.test.mjs
          run_check node --test tests/shared-media-reviews.test.mjs
          run_check node --test tests/community-hub.test.mjs
          run_check node --test tests/legacy-green-audit.test.mjs
          run_check node --test tests/action-first.test.mjs
          run_check node --test tests/vivid-refresh.test.mjs
          run_check node --test tests/live-gallery.test.mjs
          run_check node tests/live-gallery-mobile-audit.cjs
          run_check node --test tests/room-live-filters.test.mjs
          run_check node --test tests/source-fidelity.test.mjs
          run_check node --test tests/geo-feed-support.test.mjs
          run_check node --test tests/encounter-layout.test.mjs
          run_check node tests/encounter-mobile-audit.cjs
          run_check node tests/live-sheet-viewport-audit.cjs
          run_check node tests/community-mobile-audit.cjs
          run_check node tests/once-redesign-mobile-audit.cjs
          run_check node tests/theme-motion-audit.cjs
          run_check node tests/source-fidelity-mobile-audit.cjs
          run_check node tests/admin-mobile-audit.cjs
          run_check node tests/avatar-mobile-audit.cjs
          exit "$failures"

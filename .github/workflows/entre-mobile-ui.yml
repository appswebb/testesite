name: Mobile UI Regression (entre.)
on:
  push:
    branches: [main]
    paths:
      - 'docs/admin/**'
      - 'docs/features.css'
      - 'docs/manifest.webmanifest'
      - 'docs/instalar.html'
      - 'docs/dados.html'
      - 'docs/privacidade.html'
      - 'docs/termos.html'
      - 'docs/sw.js'
      - 'docs/icons/**'
      - 'docs/app.js'
      - 'docs/entre-video.js'
      - 'docs/encounter-ui.css'
      - 'docs/entre-features.css'
      - 'tests/encounter-layout.test.mjs'
      - 'docs/index.html'
      - 'docs/maintenance.css'
      - 'docs/mobile.css'
      - 'docs/social*.css'
      - 'docs/social*.js'
      - 'tests/admin-mobile-audit.cjs'
      - 'tests/avatar-mobile-audit.cjs'
      - 'tests/social-ui-regression.test.mjs'
      - '.github/workflows/entre-mobile-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (pinned)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate scripts and UI
        run: |
          node --check docs/app.js
          node --check docs/entre-video.js
          node --check docs/admin/app.js
          for f in docs/social*.js; do node --check "$f"; done
          node --check tests/admin-mobile-audit.cjs
          node --check tests/avatar-mobile-audit.cjs
          node --test tests/social-ui-regression.test.mjs
          node --test tests/encounter-layout.test.mjs
          node tests/admin-mobile-audit.cjs
          node tests/avatar-mobile-audit.cjs

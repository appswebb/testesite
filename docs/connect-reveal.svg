<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="CONNECT"><defs><radialGradient id="fade" cx=".5" cy=".5" r=".66"><stop offset=".69" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient><mask id="m"><rect width="320" height="197" fill="url(#fade)"/></mask></defs><defs><clipPath id="left"><rect x="0" y="0" width="160" height="197"/></clipPath><clipPath id="right"><rect x="160" y="0" width="160" height="197"/></clipPath><linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>.left,.right{transform-box:fill-box;transform-origin:center;animation:joinL .85s cubic-bezier(.2,.85,.2,1) both}.right{animation-name:joinR}.word{animation:word .6s .6s both}.sweep{animation:sweep .9s .5s both}@keyframes joinL{from{opacity:0;transform:translate(-45px,15px) rotate(-20deg) scale(.8)}to{opacity:1;transform:none}}@keyframes joinR{from{opacity:0;transform:translate(45px,-15px) rotate(20deg) scale(.8)}to{opacity:1;transform:none}}@keyframes word{from{opacity:0;letter-spacing:12px}to{opacity:1;letter-spacing:4px}}@keyframes sweep{from{opacity:0;transform:translateX(-150px)}40%{opacity:1}to{opacity:0;transform:translateX(340px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}</style><g transform="translate(20 22)"><g class="left" clip-path="url(#left)"><image href="data:image/avif;base64," width="320" height="197" preserveAspectRatio="none" mask="url(#m)"/></g><g class="right" clip-path="url(#right)"><image href="data:image/avif;base64," width="320" height="197" preserveAspectRatio="none" mask="url(#m)"/></g><rect class="sweep" x="0" y="20" width="28" height="156" rx="14" fill="url(#shine)" opacity="0"/></g><text class="word" x="180" y="254" fill="#F8F3FF" stroke="#AA65D3" stroke-width=".25" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="30" text-anchor="middle" letter-spacing="4">CONNECT</text></svg>
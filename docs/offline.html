<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F5F6F9"><title>Sem conexão · CONNECT</title><script>(function(){try{var p=JSON.parse(localStorage.getItem('connect.appearance.v2')||'{}');document.documentElement.dataset.theme=p.mode==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}})();</script><style>:root{--bg:#f5f6f9;--panel:#fff;--fg:#20232a;--muted:#606978;--line:#dfe3eb;--button:#20232a;--on:#fff;color-scheme:light}html[data-theme=dark]{--bg:#15171b;--panel:#20232a;--fg:#f5f6f8;--muted:#b7bdc8;--line:#393e49;--button:#f5f6f8;--on:#20232a;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,sans-serif;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;width:min(100%,800px);margin:auto auto 0}header strong{display:flex;align-items:center;gap:7px;font-size:18px}header img{object-fit:contain}main{width:min(100%,430px);margin:auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:22px}h1{font-size:26px;letter-spacing:-.04em;line-height:1.2;margin:0 0 12px}p{font-size:14px;color:var(--muted);line-height:1.6}button{border:0;border-radius:12px;background:var(--button);color:var(--on);padding:13px 17px;font-weight:700;font-size:14px;cursor:pointer}#retry{width:100%;margin-top:10px}#mode{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:9px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}footer{text-align:center;margin-top:auto;color:var(--muted);font-size:12px;padding:20px}</style></head><body><header><strong><img src="./connect-glass.svg" alt="" width="44" height="29">CONNECT</strong><button id="mode" type="button" aria-label="Alternar aparência"></button></header><main><h1>Você está sem conexão.</h1><p>Verifique sua internet e tente novamente. Suas conversas privadas não são armazenadas no cache offline.</p><button id="retry" type="button">Tentar novamente</button></main><footer>CONNECT</footer><script>const mode=document.getElementById('mode');function paint(){let dark=document.documentElement.dataset.theme==='dark';mode.setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo escuro');mode.innerHTML=dark?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>':'<svg viewBox="0 0 24 24"><path d="M20.9 13.4A9 9 0 0 1 10.6 3.1 9 9 0 1 0 20.9 13.4Z"/></svg>'}mode.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{const old=JSON.parse(localStorage.getItem('connect.appearance.v2')||'{}');localStorage.setItem('connect.appearance.v2',JSON.stringify({...old,mode:next}))}catch(e){}paint()};document.getElementById('retry').onclick=()=>location.reload();paint();</script></body></html>

<script>
/* If a CDN or session request stalls, do not leave users on a permanent loading screen. */
window.setTimeout(function () {
  var root = document.getElementById('app');
  if (root && root.firstElementChild && root.firstElementChild.classList.contains('startup') && !root.querySelector('button')) {
    root.innerHTML = '<main style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;text-align:center;padding:25px;font-family:system-ui">' +

      '<button type="button" onclick="location.reload()" style="padding:13px 22px;border:0;border-radius:13px;background:#ed8e73;color:#16221b;font-weight:800">Tentar novamente</button></main>';
  }
}, 13000);
/* Load a fresh app bundle on each visit, including after an update release. */
window.addEventListener('DOMContentLoaded', function () {
  var script = document.createElement('script');
  script.src = './app.js?live=' + Date.now();
  script.onerror = function () {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<main class="startup" style="display:grid;place-content:center;text-align:center;padding:24px;gap:16px;min-height:100dvh">' +
        '<h1>entre.</h1><p>Não foi possível carregar o site. Verifique sua conexão e tente novamente.</p>' +
        '<button type="button" onclick="location.reload()" style="border:0;border-radius:14px;padding:13px;background:#ef947a;color:#18221e;font-weight:700">Tentar novamente</button></main>';
    }
  };
  document.body.appendChild(script);
});
</script>

/* If a CDN or session request stalls, do not leave users on a permanent loading screen. */
window.setTimeout(function () {

  }
}, 13000);
/* Load a fresh app bundle on each visit, including after an update release. */
window.addEventListener('DOMContentLoaded', function () {
  var script = document.createElement('script');
  script.src = './app.js?live=' + Date.now();
  script.onerror = function () {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<main class="startup" style="display:grid;place-content:center;text-align:center;padding:24px;gap:16px;min-height:100dvh">' +

  };
  document.body.appendChild(script);
});
</script>

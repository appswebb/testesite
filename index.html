<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f5ef">
<meta name="description" content="entre. Uma pessoa de cada vez. Cinco minutos para se conhecer, uma escolha para continuar.">
<meta property="og:title" content="entre. | Cinco minutos. Uma conexão.">
<meta property="og:description" content="Uma conexão real começa com uma conversa. Conheça alguém ao vivo por cinco minutos.">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<title>entre. — O próximo oi pode mudar tudo.</title>
<link rel="stylesheet" href="./motion.css">
<link rel="stylesheet" href="./mobile.css?v=maintenance1">
<link rel="stylesheet" href="./maintenance.css?v=maintenance1">
</head>
<body>
<div id="app"><div class="startup"><span class="brand-glyph"><i></i><i></i></span><span>entre<span class="dot">.</span></span><span class="startup-pulse"></span></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<script>
/* Load a fresh app bundle on each visit, including after an update release. */
window.addEventListener('DOMContentLoaded', function () {
  var script = document.createElement('script');
  script.src = './app.js?live=' + Date.now();
  script.onerror = function () {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<main class="startup" style="display:grid;place-content:center;text-align:center;padding:24px;gap:16px;min-height:100dvh">' +
        '<h1>entre.</h1><p>Não foi possível carregar o site. Verifique sua conexão e tente novamente.</p>' +
        '<button type="button" onclick="location.reload()" style="border:0;border-radius:14px;padding:13px;background:#ef947a;color:#18221e;font-weight:700">Tentar novamente</button></main>';
    }
  };
  document.body.appendChild(script);
});
</script>
<script defer src="./motion.js"></script>
</body>
</html>
